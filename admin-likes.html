<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Song Likes | Jason Sedgwick</title><link rel="stylesheet" href="styles.css"><style>.stats-wrap{max-width:750px;margin:90px auto;padding:25px}.stats-form{display:flex;flex-wrap:wrap;gap:12px;margin:25px 0}.stats-form input{min-width:220px;flex:1;background:#222c31;color:white;border:1px solid #aeb6b9;padding:12px}.stats-list{list-style:none;padding:0}.stats-list li{display:flex;justify-content:space-between;gap:15px;padding:15px;border-bottom:1px solid #555}.stats-list strong{color:#d9b17b}</style></head><body><main class="stats-wrap"><p class="kicker">PRIVATE ARTIST DASHBOARD</p><h1 style="font-size:clamp(48px,9vw,78px)">Song Likes</h1><p>Only you can view these totals using the admin token configured in Netlify. This page does not display visitor identities.</p><form class="stats-form" id="stats-form"><label for="token" class="skip">Admin token</label><input id="token" type="password" autocomplete="off" required placeholder="Enter your private admin token"><button class="btn primary" type="submit">View likes</button></form><p id="message" role="status"></p><ul id="stats" class="stats-list"></ul><p><a class="text-link" href="/">← Return to music website</a></p></main><script>document.getElementById('stats-form').addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('message'),list=document.getElementById('stats');list.replaceChildren();message.textContent='Loading…';try{const token=document.getElementById('token').value;const res=await fetch('/.netlify/functions/song-like-stats',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!res.ok)throw new Error(res.status===401?'Invalid token or admin token not configured.':'Could not load statistics.');const data=await res.json();for(const song of data.songs){const li=document.createElement('li'),name=document.createElement('span'),count=document.createElement('strong');name.textContent=song.title;count.textContent=String(song.likes)+' likes';li.append(name,count);list.append(li)}message.textContent='Private totals loaded.'}catch(err){message.textContent=err.message}});</script></body></html>
